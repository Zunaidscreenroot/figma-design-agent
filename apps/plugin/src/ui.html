<!doctype html>
<html>
<head><meta charset="UTF-8"><title>Figma Design Agent</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#171717;background:#fff}
body{margin:0;padding:16px}h1{font-size:16px;margin:0 0 4px}
p{font-size:12px;color:#666;margin:0 0 14px;line-height:1.5}
label{display:block;font-size:11px;font-weight:600;color:#555;margin:8px 0 2px}
input,textarea{box-sizing:border-box;width:100%;border:1px solid #d6d6d6;border-radius:8px;padding:10px;font:inherit;margin:4px 0 8px}
textarea{min-height:100px;resize:vertical}
button{width:100%;padding:10px;border:0;border-radius:8px;margin:4px 0;cursor:pointer;font:inherit;font-size:12px;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}#run{background:#171717;color:#fff}#cancel{background:#eee;color:#222}
#review{margin-top:14px;padding:12px;border:1px solid #e0e0e0;border-radius:10px;background:#fafafa}#review[hidden]{display:none}
#accept{background:#176b4d;color:white}#needsChanges{background:#fff;color:#8b2f2f;border:1px solid #e5bcbc}
#status{font-size:12px;line-height:1.5;white-space:pre-wrap;margin-top:10px}
pre{background:#f6f6f6;border-radius:8px;padding:8px;font-size:10px;max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.small{font-size:11px;color:#666;margin:2px 0 6px}
</style></head>
<body>
<h1>Figma Design Agent</h1>
<p>Polished UX screens · Project memory · Execute → verify → repair → review</p>
<label>Agent endpoint</label><input id="endpoint" value="http://localhost:8787" autocomplete="off">
<label>Agent API token (only when configured by the server)</label><input id="agentToken" type="password" placeholder="Local development can leave this blank" autocomplete="off">
<label>Design task</label><textarea id="prompt" placeholder="Create a polished UX screen using the selected frame as reference. Preserve the project's component and token system."></textarea>
<button id="run">Run agent</button><button id="cancel">Cancel current run</button>
<div id="status">Ready. Select a relevant Figma frame before starting.</div>
<div id="review" hidden>
<label>Review feedback</label>
<p class="small">Accepting stores this screen as a reviewed example. If it needs changes, describe the correction so future runs can learn from it.</p>
<textarea id="reviewNote" placeholder="Optional for accepted screens. Required when requesting changes."></textarea>
<button id="accept">Accept result and remember this pattern</button>
<button id="needsChanges">Needs changes — save correction</button>
</div>
<pre id="debug"></pre>
<script>
const state={running:false,prompt:"",context:null,screenshot:null,phase:"idle",repairCount:0,taskId:null,memoryEnabled:false,planActions:[],targetFrameId:null};
const $=id=>document.getElementById(id);
const setStatus=text=>$("status").textContent=text;
const setDebug=value=>$("debug").textContent=typeof value==="string"?value:JSON.stringify(value,null,2);
const apiBase=()=>$("endpoint").value.replace(/\/$/,"");
const plugin=message=>parent.postMessage({pluginMessage:message},"*");
async function api(path,body){
  const headers={"content-type":"application/json"};const token=$("agentToken").value.trim();if(token)headers.Authorization="Bearer "+token;
  const response=await fetch(apiBase()+path,{method:"POST",headers,body:JSON.stringify(body)});const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Agent request failed");return data;
}
function showReview(message){
  state.running=false;state.phase="review";$("review").hidden=false;$("accept").disabled=false;$("needsChanges").disabled=false;
  setStatus(message+"\nReview the selected Figma result, then save your decision below.");
}
async function requestReview(verdict){
  const note=$("reviewNote").value.trim();if(verdict==="needs_changes"&&!note){setStatus("Add a short note describing what should change.");return}
  $("accept").disabled=true;$("needsChanges").disabled=true;
  try{
    const result=await api("/reviews",{taskId:state.taskId,prompt:state.prompt,context:state.context,verdict,note});setDebug(result);
    if(result.saved){setStatus(verdict==="accepted"?"Accepted example saved to project memory. Future related tasks can retrieve it.":"Correction saved to project memory. Future related tasks can use the feedback.");$("review").hidden=true;}
    else{setStatus("Review was not persisted. Configure Supabase and apply supabase/schema.sql to enable long-term memory. The Figma edit remains in your file.");$("accept").disabled=false;$("needsChanges").disabled=false;}
  }catch(error){setStatus(error?.message||String(error));$("accept").disabled=false;$("needsChanges").disabled=false;}
}
$("accept").onclick=()=>requestReview("accepted");$("needsChanges").onclick=()=>requestReview("needs_changes");
$("run").onclick=()=>{
  if(state.running)return;state.prompt=$("prompt").value.trim();if(!state.prompt){setStatus("Enter a task.");return}
  state.running=true;state.phase="planning";state.repairCount=0;state.taskId=null;state.memoryEnabled=false;state.context=null;state.screenshot=null;state.planActions=[];state.targetFrameId=null;
  $("review").hidden=true;$("reviewNote").value="";$("accept").disabled=false;$("needsChanges").disabled=false;
  setStatus("Inspecting selected Figma context…");plugin({type:"get-context"});
};
$("cancel").onclick=()=>{state.running=false;state.phase="idle";setStatus("Cancelled. Already-applied edits may remain; use Figma undo if needed.");};
window.onmessage=async event=>{
  const message=event.data.pluginMessage;if(!message)return;
  try{
    if(message.type==="context"){
      state.context=message.payload;
      setDebug({file:message.payload.fileName,selected:message.payload.selectedNodes?.map(node=>({id:node.id,name:node.name,width:node.width,height:node.height})),components:message.payload.components?.length,tokens:message.payload.tokens?.length});
      if(!state.running)return;
      if(state.phase==="planning"){
        state.targetFrameId=message.payload.selectedNodes?.[0]?.id||null;
        setStatus("Creating task record and retrieving reviewed patterns…");
        const start=await api("/tasks/start",{prompt:state.prompt,context:message.payload});state.taskId=start.taskId||null;state.memoryEnabled=Boolean(start.memoryEnabled);
        setStatus("Planning with selected-frame context"+(state.memoryEnabled?" and project memory":"")+"…");
        const plan=await api("/plan",{prompt:state.prompt,context:message.payload,taskId:state.taskId});setDebug(plan);
        if(!plan.actions?.length){showReview("No safe actions were generated. Review the task and improve the instruction.");return}
        state.planActions=plan.actions;
        setStatus("Executing "+plan.actions.length+" native Figma action(s)…");plugin({type:"execute-actions",actions:plan.actions});return;
      }
      if(state.phase==="verifying"){setStatus("Re-reading updated structure before screenshot verification…");plugin({type:"capture-selection"});return}
    }
    if(message.type==="execution-report"){
      setDebug(message.payload);if(!state.running)return;
      const failed=message.payload.results.filter(result=>!result.success);
      if(failed.length){showReview("Execution stopped because "+failed.length+" action(s) failed:\n"+failed.map(result=>result.error).join("\n"));return}
      // Keep the whole screen selected. Only select a newly created root frame; do not accidentally critique a text or child component.
      const rootFrameAction=state.planActions.find(action=>action.action==="create_frame"&&(!action.parentId||action.parentId===state.targetFrameId));
      if(rootFrameAction){
        const rootResult=message.payload.results.find(result=>result.actionId===rootFrameAction.id);
        const rootId=rootResult?.nodeIds?.[0];
        if(rootId){state.targetFrameId=rootId;plugin({type:"select-node",nodeId:rootId});}
      }
      state.phase="verifying";setStatus("Re-reading the updated design…");plugin({type:"get-context"});return;
    }
    if(message.type==="capture"){
      state.screenshot=message.payload;setStatus("Running structural and visual UX verification…");
      const critique=await api("/critique",{prompt:state.prompt,context:state.context,screenshotDataUrl:state.screenshot});setDebug(critique);
      const blocking=critique.passed!==true||critique.issues?.some(issue=>issue.severity==="error");
      if(!blocking){await api("/tasks/ready",{taskId:state.taskId});showReview("Verification gate passed. Score: "+(critique.score??"not scored")+".");return}
      if(state.repairCount>=2){await api("/tasks/ready",{taskId:state.taskId});showReview("Stopped after "+state.repairCount+" repair attempt(s). Some issues still need your decision.");return}
      state.repairCount+=1;setStatus("Repair attempt "+state.repairCount+" of 2 for issues supported by verification…");
      const repair=await api("/repair",{prompt:state.prompt,context:state.context,critique});setDebug(repair);
      if(!repair.actions?.length){await api("/tasks/ready",{taskId:state.taskId});showReview("No safe repair actions were generated. The remaining issue needs your review.");return}
      state.planActions=repair.actions;plugin({type:"execute-actions",actions:repair.actions});return;
    }
    if(message.type==="plugin-error")showReview("Figma plugin error: "+message.payload);
  }catch(error){state.running=false;state.phase="review";setStatus(error?.message||String(error));}
};
</script></body></html>
